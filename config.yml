queue:
  hash: "/rtpqueue"
  hash-aliases:
    - "/rtpq"
    - "/rynixrtpq"
  invite-time: 60
  invite-cooldown: 60
  world-default: world
  damaged-cancel: true
  delay-between-teleports: 3
  max-queue-size: 100
  priority-system: true
  actionbar-bossbar: true

duo:
  enabled: true
  size: 2
  same-location: true
  spread-distance: 2
  solo-after-seconds: 60

list-world:
  world:
    require: 2
    interval: 5
    safe: true
    center:
      x: 0
      z: 0
    radius: 500
    min-radius: 50
    attempts: 20
    min-y: 62
    max-y: 200
    unsafe-block:
      - WATER
      - LAVA
      - MAGMA_BLOCK
  world_nether:
    require: 2
    interval: 5
    safe: true
    center:
      x: 0
      z: 0
    radius: 500
    min-radius: 50
    attempts: 15
    min-y: 32
    max-y: 120
    unsafe-block:
      - LAVA
      - FIRE

# RynixRtpq GUI - /rtpq and /rtpqueue both open GUI
menu:
  title: "&8● &bRynixRtpq &8| &dDUO Queue &8●"
  size: 27
  filler:
    enable: true
    material: BLACK_STAINED_GLASS_PANE
