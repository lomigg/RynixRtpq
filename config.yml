#============
# RynixRtpq - Duo Queue Plugin
# Version 2.3.0 - Pure RynixRtpq - Clean GUI (No Author spam) - Lightweight Console
#============

queue:
  hash: "/rtpqueue"
  hash-aliases:
    - "/rtpq"
    - "/rynixrtpq"
  invite-time: 60
  invite-cooldown: 60
  world-default: world
  damaged-cancel: true
  delay-between-teleports: 3
  max-queue-size: 100
  priority-system: true
  actionbar-bossbar: true

duo:
  enabled: true
  size: 2
  same-location: true
  spread-distance: 2
  solo-after-seconds: 60

list-world:
  world:
    require: 2
    interval: 5
    safe: true
    center: {x: 0, z: 0}
    radius: 500
    min-radius: 50
    attempts: 20
    min-y: 62
    max-y: 200
    unsafe-block: [WATER, LAVA, MAGMA_BLOCK]

menu:
  title: "&8● &bRynixRtpq &8| &dDUO Queue &8●"
  size: 27
  filler: {enable: true, material: BLACK_STAINED_GLASS_PANE}
  leave: {material: RED_STAINED_GLASS_PANE, display_name: "&cLEAVE", lore: ["", "&7Vị trí: &e{position}", "&7Cần thêm: &e{need} người", "", "&cClick để rời!"], slot: 10}
  join: {material: GREEN_STAINED_GLASS_PANE, display_name: "&aJOIN", lore: ["", "&7Tham gia hàng đợi duo", "&72 người tele cùng chỗ", "&7World: &e{world}", "", "&aClick để tham gia!"], slot: 16}
  world: {material: GRASS_BLOCK, display_name: "&aWORLD | &f{world}", lore: ["&f{world}", "&7Click để chọn world", "", "&7Center: &e{x}, {z}", "&7Radius: &e{radius}"], slot: 12}
  queue: {material: BOOK, display_name: "&bQUEUE | &e{count}", lore: ["&7Đang đợi: &f{count}", "&7Cần: &e{need} người", "&7Delay: &e{interval}s", "", "&7Chế độ: DUO 2 người 1 chỗ"], slot: 13}
  invite: {material: NETHER_STAR, display_name: "&eINVITE", lore: ["&7Click để mời player", "", "&7Mời bạn bè tele cùng", "", "&eClick để mở!"], slot: 14}
  duo-info: {material: MAGENTA_BED, display_name: "&dDUO MODE", lore: ["&7Khi đủ &e{require} người", "&7Tele cùng 1 chỗ", "&7Spread: &e{spread} blocks", "&7Hiện tại: &e{count}", "&7Cần thêm: &e{need}"], slot: 4}

world-menu: {title: "&8● &aWorld Selector &8●", size: 27, filler: {enable: true, material: BLACK_STAINED_GLASS_PANE}}
invite-menu: {title: "&8● &eInvite Player &8●", size: 54, filler: {enable: true, material: BLACK_STAINED_GLASS_PANE}, next: {material: GREEN_STAINED_GLASS_PANE, display_name: "&aNEXT", lore: ["&7Trang sau"], slot: 53}, previous: {material: RED_STAINED_GLASS_PANE, display_name: "&cPREVIOUS", lore: ["&7Trang trước"], slot: 45}, close: {material: BARRIER, display_name: "&cĐóng", lore: ["&7Đóng menu"], slot: 49}}

boss-bar: {enable: true, title: "&bRynixRtpq | DUO - &f{count} chờ | Cần {need}", color: RED, style: SOLID}
title: {enable: true, title-teleport: "&b&lMatch Duo", subtitle-teleport: "&7Teleporting {player_list}", time: true, title-teleported: "&aDUO!", subtitle-teleported: "&7Teleported with {player_list}"}
action-bar: {enable: true, message: "&eTeleport in &f${interval} | &e{count} người"}
boardcast: {join: "&e{player} joined {world} queue | {count}/{require}", found: {title: "&bFound match in {world}", message: "&e{player_list} -> Teleporting together!"}}
message:
  join: "✔ &aĐã tham gia queue!"
  leave: "‼ &aBạn đã rời queue"
  already: "⚠ &cBạn đã trong queue rồi"
  reload: "&aĐã reload config!"
  location: "🔎 &cKhông tìm thấy vị trí sau {attempts} lần thử!"
  world-error: "&cKhông tìm thấy world {world}"
  non-player: "💀 &eKhông tìm thấy player"
  invited: "&aĐã mời &e{friend} ({time}s)"
  include: "&eBạn phải vào queue trước!"
  advevent: "&fBạn được &e{player} mời duo! [Click]"
  wait: "&eĐợi {time}s nữa mới mời được!"
  time-out: "⏰ &cLời mời hết hạn!"
  cooldown: "&cCooldown {time}s!"
  duo-teleported: "&aDUO! Bạn và {partners} đã tele cùng tại {world}"
  queue-full: "&cQueue đầy! Max {max}"
  damaged-cancel: "&cBạn bị đánh nên đã rời queue!"

settings: {debug: false, prefix: "&8[&bRynixRtpq&8] &f", folia-check-on-startup: true}
rtp: {default-world: world, invulnerability: {enabled: true, seconds: 5}}
cooldown: {enabled: true, time-seconds: 300}
gui: {title: "&8● &bRynixRtpq | DUO Queue ●", size: 27, refresh-ticks: 20, sound-enabled: true, filler-enabled: true, filler-material: BLACK_STAINED_GLASS_PANE}
sound:
  command: {name: UI_LOOM_SELECT_PATTERN, volume: 1.0, pitch: 1.0}
  join: {name: ENTITY_PLAYER_LEVELUP, volume: 1.0, pitch: 1.0}
  leave: {name: ENTITY_PLAYER_LEVELUP, volume: 1.0, pitch: 1.0}
  teleport: {name: ENTITY_ENDERMAN_TELEPORT, volume: 1.0, pitch: 1.0}
  success: {name: ENTITY_PLAYER_LEVELUP, volume: 1.0, pitch: 1.0}
  time: {name: BLOCK_NOTE_BLOCK_PLING, volume: 1.0, pitch: 1.0}
  click: {name: UI_BUTTON_CLICK, volume: 1.0, pitch: 1.0}
  break: {name: ITEM_SHIELD_BREAK, volume: 1.0, pitch: 1.0}
