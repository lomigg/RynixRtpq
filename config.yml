      - "&72 người sẽ tele cùng chỗ"
      - "&7World: &e{world}"
      - ""
      - "&aClick để tham gia!"
      - "&8RynixRtpq by RinZz"
    slot: 16
  world:
    material: GRASS_BLOCK
    display_name: "&aᴡᴏʀʟᴅ &7| &f{world}"
    lore:
      - "&f{world}"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ sᴇʟᴇᴄᴛ ᴡᴏʀʟᴅ"
      - ""
      - "&7Center: &e{x}, {z}"
      - "&7Radius: &e{radius}"
      - "&8RynixRtpq Duo"
    slot: 12
  queue:
    material: BOOK
    display_name: "&bǫᴜᴇᴜᴇ &7| &e{count} đang đợi"
    lore:
      - "&7ᴡᴀɪᴛɪɴɢ ɪɴ ǫᴜᴇᴜᴇ &f{count}"
      - "&7Cần: &e{need} người để duo"
      - "&7Delay: &e{interval}s"
      - ""
      - "&7Chế độ: &dDUO 2 người 1 chỗ"
      - "&8Author: &bRinZz"
    slot: 13
  invite:
    material: NETHER_STAR
    display_name: "&eɪɴᴠɪᴛᴇ &7| &eMời bạn bè duo"
    lore:
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ɪɴᴠɪᴛᴇ ᴘʟᴀʏᴇʀ"
      - ""
      - "&7Mời bạn bè cùng tele duo"
      - "&7Cùng tọa độ với bạn"
      - ""
      - "&eClick để mở danh sách!"
    slot: 14
  duo-info:
    material: MAGENTA_BED
    display_name: "&d&lDUO MODE &7| &a2 Players 1 Spot"
    lore:
      - "&7Khi đủ &e{require} người"
