      - "&7Spread: &e{spread} blocks"
      - "&7Hiện tại: &e{count} người"
      - "&7Cần thêm: &e{need} người"
    slot: 4

world-menu:
  title: "&8● &aWorld Selector &8●"
  size: 27
  filler:
    enable: true
    material: BLACK_STAINED_GLASS_PANE
  world:
