  wait: "&eBạn phải đợi &f{time}s &enữa mới mời được!"
  time-out: "⏰ &cLời mời duo đã hết hạn!"
  cooldown: "&cBạn đang cooldown &e{time}s!"
  duo-teleported: "&a&lDUO! &7Bạn và &e{partners} &7đã tele cùng nhau tại &e{world} &8| &bRynixRtpq"
  queue-full: "&cHàng đợi đầy! Max {max}"
  damaged-cancel: "&cBạn bị tấn công nên đã rời khỏi hàng đợi duo!"

settings:
  debug: false
  prefix: "&8[&bRynixRtpq&8] &f"
  folia-check-on-startup: true
  prefix-raw: "[RynixRtpq] "

rtp:
  default-world: world
  invulnerability:
    enabled: true
    seconds: 5

cooldown:
  enabled: true
  time-seconds: 300

gui:
  title: "&8● &bRynixRtpq &8| &dDUO Queue &8●"
  size: 27
  refresh-ticks: 20
  sound-enabled: true
  filler-enabled: true
  filler-material: BLACK_STAINED_GLASS_PANE

